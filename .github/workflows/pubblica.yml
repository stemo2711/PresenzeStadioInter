name: Pubblica statistiche

# Parte quando aggiorni i dati o i notebook (push su main) e a mano dal tab Actions
on:
  push:
    branches: [main]
    paths:
      - "presenze_stadio.csv"
      - "formazioni_complete.csv"
      - "formazioni.csv"
      - "formazioni_supercoppa_wikipedia.csv"
      - "*.ipynb"
      - "build_site.py"
      - "requirements.txt"
      - ".github/workflows/pubblica.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Esegui i notebook e costruisci il sito
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
